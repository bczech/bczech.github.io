on:
  push:
    branches: [master, main]
  workflow_dispatch:

name: Render Portfolio

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        run: |
          install.packages(c("rmarkdown", "knitr", "tidyr", "dplyr",
                             "ggplot2", "DT", "survival", "RColorBrewer",
                             "gridExtra", "MASS"))
        shell: Rscript {0}

      - name: Render Rmd
        run: rmarkdown::render("index.Rmd", output_file = "index.html")
        shell: Rscript {0}

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "auto: render index.html"
          git push
