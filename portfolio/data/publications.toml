# Publications shown on research.qmd and cv.qmd.
# scripts/gen_content.py reads this file before each render (pre-render hook).
#
# To add a paper: copy one [[pub]] block, put it in date order (newest first)
# and fill in the fields. Only title, authors, journal, year and doi are required.
#
#   type      "article" (peer-reviewed) or "preprint"
#   first     true if I am the first author (adds a marker on the page)
#   cite      volume, issue and pages as they should appear in the reference
#   img       figure from the paper, path relative to portfolio/
#   summary   one or two sentences: the question the paper answers
#   methods   short list of the main methods
#   tags      keywords shown as small chips
#   area      collaboration circle for the co-author network: genomics, drug, virology or other

[[pub]]
type = "article"
year = 2026
title = "A proof-of-concept study: reference transcriptome choice as a hidden analytical variable in breast cancer RNA-seq analysis"
authors = "Zieliński P, Frąszczak M, Czech B, Dobosz P, Adamiak K, Mierzejewski P, Stępień R, Mielczarek M"
journal = "International Journal of Molecular Sciences"
cite = "27(21):9398"
doi = "10.3390/ijms27219398"
area = "genomics"
summary = "Tests whether the choice between the GRCh37 and GRCh38 reference transcriptomes changes the list of differentially expressed genes in breast cancer RNA-seq data."
methods = ["Quantification with kallisto against GRCh37 and GRCh38", "Differential expression with DESeq2 under four analysis approaches"]
tags = ["RNA-seq", "Reference genome", "kallisto", "DESeq2", "Breast cancer"]

